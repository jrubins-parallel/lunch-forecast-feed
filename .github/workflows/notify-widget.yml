# Wakes the Lunch Forecast widget on your phone whenever a new forecast is pushed.
# GitHub sends one HTTP request to Firebase Cloud Messaging (FCM): a silent data message to the
# "lunch-forecast" topic, which the widget app subscribes to. No notification is shown.
#
# Setup: add a repository secret named FIREBASE_SERVICE_ACCOUNT containing the whole service-account
# JSON from Firebase (Project settings > Service accounts > Generate new private key).
# Until that secret exists, this workflow skips with a "Not set up" warning. Test it any time from
# the Actions tab with "Run workflow"; each run ends with a one-line Sent / Not set up / error note.
name: Notify widget

on:
  push:
    branches: [main]
    paths: [widget.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-widget
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send FCM data message
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${SA_JSON:-}" ]; then
            echo "::warning title=Not set up::FIREBASE_SERVICE_ACCOUNT secret is not set, so no message was sent."
            exit 0
          fi
          if ! jq -e '.private_key and .client_email and .project_id' >/dev/null 2>&1 <<<"$SA_JSON"; then
            echo "::error title=Bad secret::FIREBASE_SERVICE_ACCOUNT isn't a Firebase service-account key (needs private_key, client_email, project_id). Paste the whole downloaded .json file."
            exit 1
          fi
          umask 077
          printf '%s' "$SA_JSON" > sa.json
          jq -r .private_key sa.json > key.pem
          EMAIL=$(jq -r .client_email sa.json)
          PROJECT=$(jq -r .project_id sa.json)

          b64url() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(jq -cn --arg iss "$EMAIL" --argjson iat "$NOW" --argjson exp "$((NOW + 3600))" \
            '{iss:$iss, scope:"https://www.googleapis.com/auth/firebase.messaging", aud:"https://oauth2.googleapis.com/token", iat:$iat, exp:$exp}' | b64url)
          SIG=$(printf '%s' "$HEADER.$CLAIMS" | openssl dgst -sha256 -sign key.pem -binary | b64url)
          rm -f key.pem sa.json

          AUTH=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            -d "assertion=$HEADER.$CLAIMS.$SIG")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          if [ -z "$TOKEN" ]; then
            echo "::error title=Google sign-in failed::$(jq -c '{error, error_description}' <<<"$AUTH")"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          BODY=$(jq -cn --arg sha "$GITHUB_SHA" \
            '{message:{topic:"lunch-forecast", data:{kind:"refresh", commit:$sha}, android:{priority:"high", ttl:"3600s"}}}')
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://fcm.googleapis.com/v1/projects/$PROJECT/messages:send" -d "$BODY")
          if jq -e .name >/dev/null 2>&1 <<<"$RESP"; then
            echo "::notice title=Sent::Firebase accepted the refresh for topic lunch-forecast (project $PROJECT, commit ${GITHUB_SHA:0:7}): $(jq -r .name <<<"$RESP")"
          else
            echo "::error title=Firebase rejected the message::$(jq -c '.error | {code, status, message}' <<<"$RESP" 2>/dev/null || echo "$RESP" | head -c 300)"
            exit 1
          fi
